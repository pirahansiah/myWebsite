<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirecting — pirahansiah.com</title>
<script src="/farshid/permalinks.js"></script>
<script src="/farshid/page-aliases.js"></script>
<script>
/* Any URL that reaches this page is routed into the single-page app, which is the
   only place markdown gets rendered. Raw .md files are served by GitHub Pages as
   text/markdown (source code), so stale/bookmarked/crawled .md links are sent to
   the rendered page instead of dumping the file. */
(function(){
  var HOME = '/farshid/content/index.html';

  /* old slide names -> current slugs */
  var SLUG = {
    'llm-optimization'   : 'presentation-llm-optimization',
    'research-tools'     : 'presentation-research-tools',
    'presentation'       : 'presentation',
    'presentation-cv'    : 'presentation-cv',
    'presentation-updates': 'presentation-updates'
  };

  /* old root-level page paths -> current target (true = html page, not markdown) */
  var OLD = {
    '/qr'            : '/farshid/content/index.html#content/qr',
    '/crypto'        : 'crypto',
    '/metamask'      : 'metamask',
    '/game'          : 'game',
    '/solana-games'  : 'solana-games',
    '/privacy'       : 'privacy',
    '/terms'         : 'terms',
    '/wiki'          : 'wiki',
    '/product'       : 'product',
    '/solutions'     : 'solutions',
    '/prompts'       : 'prompts',
    '/use-cases'     : 'use-cases',
    '/why-not'       : 'why-not',
    '/menus'         : 'menus',
    '/sitemap'       : 'menus',
    '/notes/docs/product'   : 'product',
    '/notes/docs/solutions' : 'solutions'
  };

  var path = decodeURIComponent(location.pathname || '').replace(/\/+$/, '');
  var hash = location.hash || '';
  var target = null;

  /* front-matter permalinks (PIRAHANSIAH page headers): /qr/, /notes/pubs/10-years/, … */
  var PERM = window.PERMALINKS || {};
  var p1 = path.replace(/^\/+|\/+$/g, '').toLowerCase();          // farshid/content/… or …/qr
  var p2 = p1.replace(/^farshid\//, '');                          // the same path without /farshid/
  var permKey = PERM[p1] ? p1 : (PERM[p2] ? p2 : p1);
  var md = path.match(/\/([^\/]+)\.md$/i);
  var htm = path.match(/\/([^\/]+)\.html$/i);   /* pages used to be shipped as .html */
  var legacy = path.replace(/^\/farshid/, '');   /* /farshid/crypto -> /crypto */

  if (PERM[permKey]) {
    var ps = PERM[permKey];
    target = HOME + (ps === 'atlas' ? '#atlas' : '#content/' + ps);
  } else if (md) {
    /* the page file itself (old decks, bookmarks, search results) */
    var slug = md[1].toLowerCase();
    target = HOME + '#content/' + (SLUG[slug] || slug);
  } else if (htm) {
    /* a page that used to exist as .html (every link shared before Sep 2026) */
    var slug = htm[1].toLowerCase();
    if (slug === 'atlas')      target = HOME + '#atlas';
    else if (slug === 'index') target = HOME + (hash || '#home');
    else                       target = HOME + '#content/' + (SLUG[slug] || slug);
  } else if (path === '' || path === '/' || path === '/farshid' || path === '/farshid/content') {
    target = HOME + hash;
  } else if (OLD[legacy]) {
    var v = OLD[legacy];
    target = (v.charAt(0) === '/') ? v : HOME + '#content/' + v;
  } else if (/^\/notes\/slides/.test(legacy)) {
    target = HOME + '#content/research-tools';                /* talks hub */
  } else if (/^\/notes\/docs(\/|$)/.test(legacy)) {
    target = HOME + '#atlas:notes-guides';
  } else if (/^\/notes\/pubs/.test(legacy)) {
    target = HOME + '#atlas:publications';
  } else if (/^\/notes(\/|$)/.test(legacy)) {
    target = HOME + '#atlas';              /* legacy Google Sites paths */
  } else {
    target = HOME + '#atlas';              /* unknown: the Atlas is the index */
  }

  location.replace(target);
})();
</script>
</head>
<body><h1>Page not found</h1><p><a href="/farshid/content/index.html#atlas">Go to the Atlas</a></p></body></html>
