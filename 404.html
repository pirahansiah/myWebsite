<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirecting — pirahansiah.com</title>
<script src="/farshid/permalinks.js"></script>
<script src="/farshid/page-aliases.js"></script>
<script>
/* Any URL that reaches this page is routed into the single-page app, which is the
   only place markdown gets rendered. Raw .md files are served by GitHub Pages as
   text/markdown (source code), so stale/bookmarked/crawled .md links are sent to
   the rendered page instead of dumping the file. */
(function(){
  var HOME = '/farshid/content/index.html';

  /* old slide names -> current slugs */
  var SLUG = {
    'llm-optimization'   : 'presentation-llm-optimization',
    'research-tools'     : 'presentation-research-tools',
    'presentation'       : 'presentation',
    'presentation-cv'    : 'presentation-cv',
    'presentation-updates': 'presentation-updates',
    'localai': 'localAI',
    'localllmonmac': 'LocalLLMonMac',
    'ternarybonsai2': 'TernaryBonsai2'
  };

  /* old root-level page paths -> current target (true = html page, not markdown) */
  var OLD = {
    '/qr'            : 'qr',
    '/crypto'        : 'crypto',
    '/metamask'      : 'metamask',
    '/game'          : 'game',
    '/solana-games'  : 'solana-games',
    '/privacy'       : 'privacy',
    '/terms'         : 'terms',
    '/wiki'          : 'wiki',
    '/product'       : 'product',
    '/solutions'     : 'solutions',
    '/prompts'       : 'prompts',
    '/use-cases'     : 'use-cases',
    '/why-not'       : 'why-not',
    '/menus'         : 'menus',
    '/sitemap'       : 'menus',
    '/notes/docs/product'   : 'product',
    '/notes/docs/solutions' : 'solutions'
  };

  var MOVED_FILES = {
    '/farshid/avatar.jpg': '/farshid/assets/profile.jpg',
    '/farshid/favicon.png': '/farshid/assets/favicon.png',
    '/qr/index.html': '/farshid/qr/index.html',
    '/farshid/products/computer-vision-ai-engineers-guide.pdf': '/farshid/downloads/cv-engineers-guide.pdf',
    '/farshid/products/local-llm-optimization-20260905.zip': '/farshid/downloads/local-llm-source.zip',
    '/farshid/products/optimize_local_llm.sh': '/farshid/downloads/optimize-llm.sh',
    '/farshid/products/optimization.md': '/farshid/downloads/optimization.md',
    '/farshid/products/etsy-listings.txt': '/farshid/downloads/store-listings.txt',
    '/farshid/expert-coaching-resources/opencv_5_cheat_sheet_pirahansiah.pdf': '/farshid/downloads/opencv5-cheatsheet.pdf',
    '/farshid/expert-coaching-resources/linkedin.jpg': '/farshid/content/linkedin-card.jpg',
    '/farshid/content/mind_map_orchestrating_agents.png': '/farshid/content/agent-orchestration-map.png',
    '/farshid/content/vscodecudawindows.png': '/farshid/content/cuda-windows-vscode.png',
    '/farshid/content/cuda_numba_jit_tutorial.png': '/farshid/content/numba-jit.png',
    '/farshid/content/cuda_pycuda_kernel_explanation.png': '/farshid/content/pycuda-kernel.png',
    '/farshid/content/mind_map_advanced_llm_concepts.png': '/farshid/content/llm-concepts-map.png',
    '/farshid/content/microsoft_ai_use_cases.png': '/farshid/content/microsoft-ai-use-cases.png',
    '/farshid/content/optimizationml.png': '/farshid/content/ml-optimization.png',
    '/farshid/content/under_over_fit_ml.png': '/farshid/content/ml-overfitting.png',
    '/farshid/content/recommended ml optimization and project workflow.png': '/farshid/content/ml-workflow.png',
    '/farshid/content/image_00005_.png': '/farshid/content/qwen-image-21-8gb-mindmap.png',
    '/farshid/content/dr._farshid_pirahansiah_3_patents_-_ai_innovations_in_vehicle_detection,_facial_analysis,_and_image_augmentation.png': '/farshid/content/patent-portfolio.png'
  };

  var path = decodeURIComponent(location.pathname || '').replace(/\/+$/, '');
  var hash = location.hash || '';
  var moved = MOVED_FILES[path.toLowerCase()];
  if (!moved && /^\/farshid\/products\//i.test(path)) moved = path.replace(/^\/farshid\/products\//i, '/farshid/downloads/');
  if (!moved && /^\/farshid\/fonts\//i.test(path)) moved = path.replace(/^\/farshid\/fonts\//i, '/farshid/assets/');
  if (!moved && /^\/farshid\/expert-coaching-resources\//i.test(path)) moved = path.replace(/^\/farshid\/expert-coaching-resources\//i, '/farshid/content/');
  if (moved) { location.replace(moved + location.search + hash); return; }
  var target = null;

  /* Clean route handoff: index.html?p=<route>. The app renders it and immediately
     rewrites the URL to the permanent path, so the address bar never shows a
     #content/… hash — not even for the instant it takes to redirect. */
  function R(route){ return HOME + '?p=' + encodeURIComponent(route); }

  /* front-matter permalinks (PIRAHANSIAH page headers): /qr/, /notes/pubs/10-years/, … */
  var PERM = window.PERMALINKS || {};
  var p1 = path.replace(/^\/+|\/+$/g, '').toLowerCase();          // farshid/content/… or …/qr
  var p2 = p1.replace(/^farshid\//, '');                          // the same path without /farshid/
  var permKey = PERM[p1] ? p1 : (PERM[p2] ? p2 : p1);
  var md = path.match(/\/([^\/]+)\.md$/i);
  var htm = path.match(/\/([^\/]+)\.html$/i);   /* pages used to be shipped as .html */
  var legacy = path.replace(/^\/farshid/, '');   /* /farshid/crypto -> /crypto */

  if (PERM[permKey]) {
    var ps = PERM[permKey];
    target = R(ps === 'atlas' ? 'atlas' : 'content/' + ps);
  } else if (md) {
    /* the page file itself (old decks, bookmarks, search results) */
    var slug = md[1].toLowerCase();
    target = R('content/' + (SLUG[slug] || slug));
  } else if (htm) {
    /* a page that used to exist as .html (every link shared before Sep 2026) */
    var slug = htm[1].toLowerCase();
    if (slug === 'atlas')      target = R('atlas');
    else if (slug === 'index') target = R(hash ? hash.replace(/^#/,'') : 'home');
    else                       target = R('content/' + (SLUG[slug] || slug));
  } else if (path === '' || path === '/' || path === '/farshid' || path === '/farshid/content') {
    target = R(hash ? hash.replace(/^#/,'') : 'home');
  } else if (OLD[legacy]) {
    var v = OLD[legacy];
    target = (v.charAt(0) === '/') ? v : R('content/' + v);
  } else if (/^\/notes\/slides/.test(legacy)) {
    target = R('content/research-tools');                /* talks hub */
  } else if (/^\/notes\/docs(\/|$)/.test(legacy)) {
    target = R('atlas:notes-guides');
  } else if (/^\/notes\/pubs/.test(legacy)) {
    target = R('atlas:publications');
  } else if (/^\/notes(\/|$)/.test(legacy)) {
    target = R('atlas');              /* legacy Google Sites paths */
  } else {
    target = R('atlas');              /* unknown: the Atlas is the index */
  }

  location.replace(target);
})();
</script>
